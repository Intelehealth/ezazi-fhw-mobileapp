name: web-ci

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'turbo.json'
      - '.github/workflows/web-ci.yml'

jobs:
  typecheck-lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # `npm install`, not `npm ci` — package-lock.json is gitignored in this
      # repo (see apps/web/Dockerfile's note on the same thing).
      - run: npm install
      - run: npx turbo run typecheck lint test build --filter=./apps/web...
