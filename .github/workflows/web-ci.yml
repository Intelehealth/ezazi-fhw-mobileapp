name: Erevemp
on:
  push:
    branches:
      - monorepo-architecture-changes
  workflow_dispatch:  # Allows manual trigger
  
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # STEP 1: Fetch the .env from the server to use during the build
      - name: Download .env via Native SCP
        run: |
          # Create the .ssh directory and add the private key
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Add the server to known_hosts to prevent interactive prompts
          ssh-keyscan -H ${{ secrets.EREVAMP_HOST }} >> ~/.ssh/known_hosts
          
          # Ensure the local destination directory exists
          mkdir -p ./web
          
          # Execute the download
          scp -i ~/.ssh/id_rsa ${{ secrets.SSH_USER }}@${{ secrets.EREVAMP_HOST }}:/home/ubuntu/deploy/webapp/.env ./web/.env

      # DEBUG: confirm what's actually in ./web before building
      - name: Debug - inspect web folder
        run: |
          echo "--- Current directory ---"
          pwd
          echo "--- Listing repo root ---"
          ls -la
          echo "--- Listing ./web ---"
          ls -la ./web

      # STEP 2: Build the Docker image (Dockerfile will now find the .env)
      - name: Build and Save Docker Image
        run: |
          
          docker build -f apps/web/Dockerfile
          docker save intelehealth-webapp:latest | gzip > webapp_image.tar.gz

      # STEP 3: Transfer the built image back to the server
      - name: Upload Image to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EREVAMP_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "webapp_image.tar.gz"
          target: "/tmp"

      # STEP 4: Restart the container
      - name: Deploy Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EREVAMP_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /tmp
            gunzip -c webapp_image.tar.gz | docker load
            
            docker stop webapp-container || true
            docker rm webapp-container || true
            
            # Note: We still mount the .env at runtime just in case 
            # your Node server (SSR) or Docker entrypoint needs it.
            docker run -d \
              --name webapp-container \
              -p 81:80 \
              --env-file /home/ubuntu/deploy/webapp/.env \
              intelehealth-webapp:latest
