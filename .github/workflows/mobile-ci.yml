name: mobile-ci

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'package.json'
      - 'turbo.json'
  push:
    branches: [main, dev_kaveri_sprint45_revamp]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx turbo run typecheck lint test --filter=./apps/mobile...
