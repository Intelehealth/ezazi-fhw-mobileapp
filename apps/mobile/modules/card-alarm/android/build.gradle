plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'org.intelehealth.ezazi'
version = '1.0.0'

android {
  namespace "org.intelehealth.ezazi.cardalarm"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  // Same version react-native-notify-kit already brings in, so Gradle resolves one copy.
  implementation 'androidx.work:work-runtime:2.11.1'
}
