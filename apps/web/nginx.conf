server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The app is built with VITE_BASE_PATH=/intelehealth (see web-deploy.yml),
    # so the page asks for /intelehealth/assets/..., and the proxy in front of
    # this container forwards the /intelehealth prefix unchanged. dist/ sits at
    # the nginx root, so the prefix is stripped here and the request is handled
    # by the location below like any other — static files are served as-is and
    # client-side routes fall back to index.html.
    location = /intelehealth {
        return 301 /intelehealth/;
    }

    location /intelehealth/ {
        rewrite ^/intelehealth/(.*)$ /$1 last;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
